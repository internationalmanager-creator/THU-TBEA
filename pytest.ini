[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts =
    -ra
    --tb=short
    --strict-markers
    --color=yes

markers =
    slow: tests que tardan mas de 5 segundos
    integration: tests que requieren recursos externos (LaTeX, red)
    thu: tests especificos del programa THU-TBEA
    chain: tests de integridad criptografica

filterwarnings =
    ignore::DeprecationWarning:streamlit.*
    ignore::DeprecationWarning:plotly.*